<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Time Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    {% block content %}
    {% endblock %}

    <script>
        // CSRF token for AJAX requests
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        // Timezone utilities
        function formatDateToLocal(utcDateString) {
            try {
                // Handle different possible date formats
                let date;
                if (utcDateString.includes('T')) {
                    // ISO format with T separator
                    date = new Date(utcDateString);
                } else {
                    // Try parsing as is first
                    date = new Date(utcDateString);
                    if (isNaN(date.getTime())) {
                        // If that fails, try adding Z to indicate UTC
                        date = new Date(utcDateString + 'Z');
                    }
                }
                
                // Check if date is valid
                if (isNaN(date.getTime())) {
                    console.error('Invalid date:', utcDateString);
                    return 'Invalid Date';
                }
                
                return date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                }) + ' ' + date.toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
            } catch (error) {
                console.error('Error formatting date:', error, 'Input:', utcDateString);
                return 'Date Error';
            }
        }

        function getUserTimezone() {
            return Intl.DateTimeFormat().resolvedOptions().timeZone;
        }
    </script>
</body>
</html>
